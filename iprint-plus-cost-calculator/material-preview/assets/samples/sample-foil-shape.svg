<?xml version="1.0" encoding="UTF-8"?>
<!--
  Sample for Layer 3 (finish shape): only the SHAPE matters — the colour is ignored.
  Same 96 x 60 mm artboard as sample-artwork.svg, so this lands exactly on the logo mark and the name bar.
  Use it for Spot UV, Gold / Silver Foil, Emboss or Deboss.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 60" width="96mm" height="60mm">
  <title>iPrint sample finish shape (Layer 3)</title>
  <circle cx="23" cy="20" r="9" fill="none" stroke="#000000" stroke-width="1.6"/>
  <path d="M23 13.5 L26.2 20 L23 26.5 L19.8 20 Z" fill="#000000"/>
  <rect x="37" y="15" width="44" height="7" rx="1" fill="#000000"/>
</svg>
