name = "iprint-flow-api"
main = "index.js"
compatibility_date = "2026-08-31"

[vars]
NOTION_DATA_SOURCE_ID = "3c81a0ce-e8bd-800d-b31f-000b0deb3ee3"
NOTION_MATERIALS_DATA_SOURCE_ID = "d251a0ce-e8bd-8314-bc43-074b0f9cedb7"
NOTION_SERVICES_DATA_SOURCE_ID = "3d71a0ce-e8bd-8342-b818-078d7bf8818e"
NOTION_CUSTOMERS_DATA_SOURCE_ID = "3ca1a0ce-e8bd-805d-a279-000b9b7152c1"
NOTION_QUOTES_DATA_SOURCE_ID = "3ca1a0ce-e8bd-80c5-8f5b-000bfb368895"
NOTION_TICKETS_DATA_SOURCE_ID = "4001a0ce-e8bd-8312-a136-07db4162080f"
NOTION_ORDER_ITEMS_DATA_SOURCE_ID = "3cc1a0ce-e8bd-8068-acd1-000bcaea0f4a"
NOTION_CAPACITY_DATA_SOURCE_ID = "1038efe9-a49d-4561-9345-76c8ec0810cd"
NOTION_PRODUCTION_ALLOCATIONS_DATA_SOURCE_ID = "3d51a0ce-e8bd-80b1-b59c-e889da76463b"
CAPACITY_DEFAULT_DAILY = "20"
CAPACITY_CUTOFF_TIME = "15:00"
CAPACITY_BUSINESS_DAYS = "1,2,3,4,5,6"
CAPACITY_TIME_ZONE = "Asia/Bangkok"
CAPACITY_MAX_SEARCH_DAYS = "180"
CAPACITY_LARGE_JOB_DAILY_SHARE = "0.5"
CAPACITY_ENFORCE_DEADLINE = "true"
CORS_ALLOWED_ORIGINS = "https://iprint.tchl.online"
PUBLIC_ORDER_ENABLED = "true"
TURNSTILE_EXPECTED_HOSTNAME = "iprint.tchl.online"
LINE_BOT_ENABLED = "true"

# ---- Brief Button V1 (LINE -> Draft Brief -> Notion ticket) ----
# Secrets (npx wrangler secret put ...): LINE_CHANNEL_SECRET, LINE_CHANNEL_ACCESS_TOKEN (optional), OPENAI_API_KEY (optional GPT-5 nano fallback)
# Optional variables: BRIEF_AI_PROVIDER (workers-ai or openai), BRIEF_AI_MODEL, BRIEF_OPENAI_MODEL (default gpt-5-nano), LINE_RETENTION_DAYS (default 30), LINE_BOT_ENABLED (default false)
# Database created for the LINE conversation archive used by /brief/.
[[d1_databases]]
binding = "BRIEF_DB"
database_name = "iprint-brief"
database_id = "7a8083a5-72d5-4b4b-8701-4428858b8eaf"
migrations_dir = "migrations"

# Workers AI has a daily free allocation and needs no third-party API key.
[ai]
binding = "AI"

# ---- Pictures uploaded from the set studio (gallery of a set) ----
# Pictures are stored in this R2 bucket (created once; steps in MEDIA_SETUP.md):
#   npx wrangler r2 bucket create iprint-media
[[r2_buckets]]
binding = "MEDIA"
bucket_name = "iprint-media"

# ---- Public order rate limiting ----
# Fixed-window request counter per client IP for POST /public/orders, to blunt spam/bot abuse
# (Turnstile only proves "a human/solver ran this once"; it doesn't limit how often).
# Tunable via vars: PUBLIC_ORDER_RATE_LIMIT_MAX (default 5), PUBLIC_ORDER_RATE_LIMIT_WINDOW_SECONDS (default 60).
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "4eed4bbf78074d27b890f7802c953244"
