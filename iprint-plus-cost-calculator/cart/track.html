<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ติดตามออร์เดอร์ — iPrint</title>
  <link rel="icon" type="image/svg+xml" href="../image/iprint-logo.svg">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="ติดตามสถานะออร์เดอร์งานพิมพ์ iPrint ด้วยเลขติดตามหรือลิงก์ที่ได้รับหลังสั่งซื้อ">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="iPrint">
  <meta property="og:title" content="ติดตามออร์เดอร์ — iPrint">
  <meta property="og:description" content="ติดตามสถานะออร์เดอร์งานพิมพ์ iPrint ด้วยเลขติดตามหรือลิงก์ที่ได้รับหลังสั่งซื้อ">
  <meta property="og:url" content="https://iprint.tchl.online/cart/track.html">
  <meta property="og:image" content="https://iprint.tchl.online/catalog/assets/hero.png">
  <meta property="og:locale" content="th_TH">
  <link rel="stylesheet" href="../shared/tokens.css?v=1">
  <link rel="stylesheet" href="../business-card/order.css">
  <link rel="stylesheet" href="cart.css">
  <link rel="stylesheet" href="../shared/typography.css?v=1">
</head>
<body>
  <header class="order-nav">
    <a href="../catalog/" aria-label="กลับไป Catalog">‹</a>
    <b>ติดตามออร์เดอร์</b>
    <span></span>
  </header>
  <main class="order-shell">
    <p id="status" class="status" role="status"></p>
    <section class="sheet" id="trackSheet" aria-live="polite"></section>
    <section class="sheet" id="lookupSheet" hidden>
      <h1>ติดตามออร์เดอร์</h1>
      <p class="track-intro" id="lookupIntro">กรอกเลขติดตามหรือวางลิงก์ติดตามที่ได้รับหลังสั่งซื้อ</p>
      <form id="lookupForm" class="track-lookup" novalidate>
        <label for="trackingInput">เลขติดตามหรือลิงก์ติดตาม</label>
        <input id="trackingInput" autocomplete="off" spellcheck="false" placeholder="เช่น 1a2b3c4d-… หรือวางลิงก์ทั้งหมด" aria-describedby="trackingError">
        <small class="field-error" id="trackingError" hidden></small>
        <button type="submit">ดูสถานะ</button>
      </form>
      <p class="track-help">หาเลขติดตามไม่เจอ? <a id="lineHelp" href="https://lin.ee/q39R98w" target="_blank" rel="noopener">ติดต่อทีมงานทาง LINE</a></p>
    </section>
    <section class="sheet" id="recentSheet" hidden>
      <h2>ออร์เดอร์ที่สั่งจากเครื่องนี้</h2>
      <div id="recentList"></div>
    </section>
  </main>
  <script type="module" src="track.js"></script>
</body>
</html>
