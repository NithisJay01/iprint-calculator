<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>iPrint Logic Test Runner</title>
  <style>
    body{margin:0;background:#f3f5f7;color:#111315;font:14px system-ui,sans-serif}
    main{max-width:900px;margin:0 auto;padding:24px}
    h1{margin:0 0 6px;font-size:22px}.note{color:#687078;margin:0 0 18px;line-height:1.5}
    button{padding:10px 14px;border:0;border-radius:8px;background:#0a8cff;color:#fff;font-weight:700;cursor:pointer}
    #summary{margin:16px 0;font-weight:700}.pass{color:#26734d}.fail{color:#c62828}
    #results{margin:0;padding-left:22px}.pass::marker{color:#26734d}.fail::marker{color:#c62828}
    iframe{width:100%;height:700px;border:1px solid #d3d8de;border-radius:12px;background:#fff}
  </style>
</head>
<body>
  <main>
    <h1>iPrint Logic Test Runner</h1>
    <p class="note">ทดสอบ calculation, วัสดุ, บริการ และใบเสนอราคา ผ่านแอปตัวจริง โดยไม่กดบันทึกหรือส่งข้อมูลไปยัง Notion</p>
    <button id="runTests" type="button">รันทดสอบทั้งหมด</button>
    <div id="summary" aria-live="polite">พร้อมทดสอบ</div>
    <ol id="results"></ol>
    <iframe id="app" src="../index.html" title="iPrint application under test"></iframe>
  </main>
  <script src="logic-test.js"></script>
</body>
</html>
