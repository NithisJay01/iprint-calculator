<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>สร้างออร์เดอร์นามบัตร — iPrint</title>
  <link rel="stylesheet" href="order.css">
  <link rel="stylesheet" href="../shared/typography.css?v=1">
</head>
<body>
  <header class="order-nav">
    <a href="./#packages" aria-label="กลับไป Catalog">‹</a>
    <b id="pageTitle">สร้างออร์เดอร์นามบัตร</b>
    <a class="nav-cart" href="../cart/" aria-label="เปิดตะกร้าสินค้า"><img src="../catalog/assets/cart.svg" alt=""><b id="cartCount">0</b></a>
  </header>
  <main class="order-shell">
    <p id="status" class="status" role="status"></p>

    <section class="step">
      <div class="product-hero"><img id="productImage" src="assets/hero.png" alt="ตัวอย่างเซตนามบัตร"><button type="button" class="upload-look" id="changeImage">ลองแบบของคุณ / เปลี่ยนภาพ</button></div>
      <div class="sheet"><span class="eyebrow">BUSINESS CARD SET</span><h1 id="productName">กำลังโหลดเซต…</h1><p id="productTagline"></p><strong class="start-price" id="startPrice"></strong>
        <h2>สเปกในเซต</h2><ul class="spec-list" id="specList"></ul>
        <label>ใส่ลิงก์ไฟล์ของท่าน <input id="driveLink" type="url" placeholder="https://drive.google.com/design/…"><small>รองรับลิงก์ Google Drive, Dropbox หรือไฟล์บน Cloud</small></label>
        <h2>จำนวน</h2><div id="quantityChoices" class="choice-grid"></div>
        <h2>เลือกวัสดุ</h2><div id="materialChoices" class="choice-grid"></div>
        <h2>รูปแบบการพิมพ์</h2><div id="printChoices" class="choice-grid"></div>
        <h2>ออปชันเพิ่มเติม</h2><div id="extraChoices" class="choice-grid"></div>
        <div class="price-box">
          <div id="priceBreakdown"></div>
          <div class="promo-row">
            <label for="promoCode">โค้ดส่วนลด (ถ้ามี)</label>
            <input id="promoCode" type="text" maxlength="80" autocomplete="off" placeholder="ใส่โค้ดส่วนลด (Promo Code)">
            <small id="promoHint" role="status"></small>
          </div>
        </div>
      </div>
    </section>
  </main>
  <footer class="checkout-bar">
    <div><small id="totalLabel">ราคารายการนี้</small><strong id="grandTotal">฿0.00</strong></div>
    <button type="button" id="next">เพิ่มสินค้าลงตะกร้า</button>
  </footer>
  <script type="module" src="order.js"></script>
</body>
</html>
