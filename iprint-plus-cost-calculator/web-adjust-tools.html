<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brief Designer Tool</title>
  <style>
    :root {
      --bg: #f3f5f7;
      --panel: #ffffff;
      --line: #dfe5eb;
      --text: #111315;
      --muted: #687078;
      --blue: #0a8cff;
      --soft: #f5f9ff;
      --shadow: 0 16px 44px rgba(17, 19, 21, 0.12);
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Tahoma, sans-serif;
    }

    body {
      min-height: 100vh;
      padding: 20px;
    }

    .designer-shell {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
      max-width: 1600px;
      margin: 0 auto;
      min-height: calc(100vh - 40px);
    }

    .tool-panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      box-shadow: var(--shadow);
      overflow: auto;
    }

    .tool-panel h2 {
      margin: 0 0 16px;
      font-size: 20px;
    }

    .field {
      display: grid;
      gap: 8px;
      margin-bottom: 14px;
    }

    label {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    input, select, button, textarea {
      width: 100%;
      border: 1px solid #d7dfe7;
      border-radius: 10px;
      background: #fff;
      color: var(--text);
      padding: 10px 12px;
      font: inherit;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(10,140,255,.12);
    }

    .two-col {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .preview-panel {
      background: #edf3f7;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 600px;
      box-shadow: var(--shadow);
    }

    #previewStage {
      width: min(100%, 1100px);
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: auto;
      padding: 6px;
    }

    #previewStage svg {
      max-width: 100%;
      height: auto;
      display: block;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: #f4f7fa;
      box-shadow: 0 10px 26px rgba(17, 19, 21, 0.08);
    }

    .action-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 8px;
    }

    .btn {
      border: 0;
      cursor: pointer;
      font-weight: 700;
      transition: filter 0.15s ease, transform 0.15s ease;
    }

    .btn:hover {
      filter: brightness(0.98);
      transform: translateY(-1px);
    }

    .btn.primary { background: var(--blue); color: white; }
    .btn.secondary { background: #eef3f7; color: var(--text); }
    .btn.warning { background: #fff7df; color: #8a5b00; }

    .status {
      margin-top: 12px;
      font-size: 12px;
      color: var(--muted);
      min-height: 16px;
    }

    @media (max-width: 980px) {
      .designer-shell {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="designer-shell">
    <aside class="tool-panel">
      <h2>Brief Designer</h2>

      <div class="field">
        <label for="sectionSelect">Section</label>
        <select id="sectionSelect">
          <option value="header">Header</option>
          <option value="preview">Preview</option>
          <option value="description">Description</option>
          <option value="reference">Reference</option>
        </select>
      </div>

      <div class="two-col">
        <div class="field">
          <label for="x">X</label>
          <input id="x" type="number" value="50" />
        </div>
        <div class="field">
          <label for="y">Y</label>
          <input id="y" type="number" value="170" />
        </div>
      </div>

      <div class="two-col">
        <div class="field">
          <label for="width">Width</label>
          <input id="width" type="number" value="980" />
        </div>
        <div class="field">
          <label for="height">Height</label>
          <input id="height" type="number" value="120" />
        </div>
      </div>

      <div class="two-col">
        <div class="field">
          <label for="radius">Radius</label>
          <input id="radius" type="number" value="20" />
        </div>
        <div class="field">
          <label for="fontSize">Font size</label>
          <input id="fontSize" type="number" value="18" />
        </div>
      </div>

      <div class="two-col">
        <div class="field">
          <label for="margin">Margin</label>
          <input id="margin" type="number" value="24" />
        </div>
        <div class="field">
          <label for="scale">Scale</label>
          <input id="scale" type="number" min="0.1" max="2" step="0.1" value="1" />
        </div>
      </div>

      <div class="field">
        <label for="imageUpload">Upload Image</label>
        <input id="imageUpload" type="file" accept="image/*" />
      </div>

      <div class="action-row">
        <button class="btn primary" id="exportSvgBtn" type="button">Export SVG</button>
        <button class="btn secondary" id="exportPngBtn" type="button">Export PNG</button>
      </div>

      <div class="action-row">
        <button class="btn warning" id="resetBtn" type="button" style="grid-column: 1 / -1;">Reset section</button>
      </div>

      <div class="status" id="statusText">Ready</div>
    </aside>

    <main class="preview-panel">
      <div id="previewStage" aria-live="polite"></div>
    </main>
  </div>

  <script>
    const state = {
      activeSection: 'header',
      sections: {
        header: { x: 50, y: 30, width: 980, height: 120, radius: 20, fontSize: 18, margin: 24, scale: 1, image: '' },
        preview: { x: 50, y: 170, width: 980, height: 680, radius: 20, fontSize: 18, margin: 24, scale: 1, image: '' },
        description: { x: 50, y: 890, width: 980, height: 120, radius: 20, fontSize: 18, margin: 24, scale: 1, image: '' },
        reference: { x: 50, y: 1040, width: 980, height: 220, radius: 20, fontSize: 18, margin: 24, scale: 1, image: '' }
      }
    };

    const labels = {
      header: 'Header',
      preview: 'Preview',
      description: 'Description',
      reference: 'Reference'
    };

    const els = {
      sectionSelect: document.getElementById('sectionSelect'),
      x: document.getElementById('x'),
      y: document.getElementById('y'),
      width: document.getElementById('width'),
      height: document.getElementById('height'),
      radius: document.getElementById('radius'),
      fontSize: document.getElementById('fontSize'),
      margin: document.getElementById('margin'),
      scale: document.getElementById('scale'),
      imageUpload: document.getElementById('imageUpload'),
      previewStage: document.getElementById('previewStage'),
      statusText: document.getElementById('statusText'),
      exportSvgBtn: document.getElementById('exportSvgBtn'),
      exportPngBtn: document.getElementById('exportPngBtn'),
      resetBtn: document.getElementById('resetBtn')
    };

    function getCurrentSection() {
      return state.sections[state.activeSection];
    }

    function syncControls() {
      const section = getCurrentSection();
      els.x.value = section.x;
      els.y.value = section.y;
      els.width.value = section.width;
      els.height.value = section.height;
      els.radius.value = section.radius;
      els.fontSize.value = section.fontSize;
      els.margin.value = section.margin;
      els.scale.value = section.scale;
    }

    function render() {
      const svg = `
        <svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1400" viewBox="0 0 1080 1400">
          <rect width="1080" height="1400" fill="#f4f7fa" />
          ${buildSectionMarkup(state.sections.header, 'Header')}
          ${buildSectionMarkup(state.sections.preview, 'Preview')}
          ${buildSectionMarkup(state.sections.description, 'Description')}
          ${buildSectionMarkup(state.sections.reference, 'Reference')}
        </svg>
      `;
      els.previewStage.innerHTML = svg;
    }

    function buildSectionMarkup(section, title) {
      const innerW = Math.max(40, section.width - section.margin * 2);
      const innerH = Math.max(30, section.height - section.margin * 2);

      const imageMarkup = section.image
        ? `
          <image
            href="${section.image}"
            x="${section.x + section.margin}"
            y="${section.y + section.margin + 26}"
            width="${innerW}"
            height="${Math.max(20, innerH - 26)}"
            preserveAspectRatio="xMidYMid meet"
          />
        `
        : '';

      return `
        <g>
          <rect
            x="${section.x}"
            y="${section.y}"
            width="${section.width}"
            height="${section.height}"
            rx="${section.radius}"
            fill="#ffffff"
            stroke="#dfe5eb"
            stroke-width="1.2"
          />
          <text
            x="${section.x + section.margin}"
            y="${section.y + 34}"
            fill="#111315"
            font-size="${section.fontSize}"
            font-weight="700"
            font-family="Arial, Tahoma, sans-serif"
          >${title}</text>
          ${imageMarkup}
        </g>
      `;
    }

    function updateCurrentSectionFromControls() {
      const section = getCurrentSection();
      section.x = Number(els.x.value || 0);
      section.y = Number(els.y.value || 0);
      section.width = Number(els.width.value || 0);
      section.height = Number(els.height.value || 0);
      section.radius = Number(els.radius.value || 0);
      section.fontSize = Number(els.fontSize.value || 0);
      section.margin = Number(els.margin.value || 0);
      section.scale = Number(els.scale.value || 1);
      render();
    }

    function readFileAsDataUrl(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error('Read image failed'));
        reader.readAsDataURL(file);
      });
    }

    function bindEvents() {
      els.sectionSelect.addEventListener('change', (event) => {
        state.activeSection = event.target.value;
        syncControls();
        render();
        els.statusText.textContent = `Editing: ${labels[state.activeSection]}`;
      });

      ['x', 'y', 'width', 'height', 'radius', 'fontSize', 'margin', 'scale'].forEach((key) => {
        els[key].addEventListener('input', () => {
          updateCurrentSectionFromControls();
          els.statusText.textContent = `Editing: ${labels[state.activeSection]}`;
        });
      });

      els.imageUpload.addEventListener('change', async (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        try {
          const dataUrl = await readFileAsDataUrl(file);
          getCurrentSection().image = dataUrl;
          render();
          els.statusText.textContent = `Image updated for ${labels[state.activeSection]}`;
        } catch (error) {
          els.statusText.textContent = 'Unable to load image';
        }
      });

      els.resetBtn.addEventListener('click', () => {
        const defaults = {
          header: { x: 50, y: 30, width: 980, height: 120, radius: 20, fontSize: 18, margin: 24, scale: 1, image: '' },
          preview: { x: 50, y: 170, width: 980, height: 680, radius: 20, fontSize: 18, margin: 24, scale: 1, image: '' },
          description: { x: 50, y: 890, width: 980, height: 120, radius: 20, fontSize: 18, margin: 24, scale: 1, image: '' },
          reference: { x: 50, y: 1040, width: 980, height: 220, radius: 20, fontSize: 18, margin: 24, scale: 1, image: '' }
        };

        Object.assign(state.sections[state.activeSection], defaults[state.activeSection]);
        syncControls();
        render();
        els.statusText.textContent = `Reset ${labels[state.activeSection]}`;
      });

      els.exportSvgBtn.addEventListener('click', () => {
        const svgEl = els.previewStage.querySelector('svg');
        if (!svgEl) return;

        const svgText = new XMLSerializer().serializeToString(svgEl);
        const blob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);

        const a = document.createElement('a');
        a.href = url;
        a.download = 'brief-designer-export.svg';
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        els.statusText.textContent = 'SVG exported';
      });

      els.exportPngBtn.addEventListener('click', () => {
        const svgEl = els.previewStage.querySelector('svg');
        if (!svgEl) return;

        const svgText = new XMLSerializer().serializeToString(svgEl);
        const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          canvas.width = 1080;
          canvas.height = 1400;
          const ctx = canvas.getContext('2d');

          ctx.fillStyle = '#f4f7fa';
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          canvas.toBlob((pngBlob) => {
            if (!pngBlob) {
              els.statusText.textContent = 'PNG export failed';
              return;
            }

            const pngUrl = URL.createObjectURL(pngBlob);
            const a = document.createElement('a');
            a.href = pngUrl;
            a.download = 'brief-designer-export.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(pngUrl);
            URL.revokeObjectURL(url);

            els.statusText.textContent = 'PNG exported';
          }, 'image/png');
        };

        img.onerror = () => {
          els.statusText.textContent = 'Unable to render PNG';
          URL.revokeObjectURL(url);
        };

        img.src = url;
      });
    }

    bindEvents();
    syncControls();
    render();
    els.statusText.textContent = `Editing: ${labels[state.activeSection]}`;
  </script>
</body>
</html>
